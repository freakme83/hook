<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Basket Shooter Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: radial-gradient(circle, #1a202c 0%, #000000 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            display: block;
            max-width: 100%;
            max-height: 100%;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }
        #ui-layer {
            position: absolute;
            top: 20px;
            left: 0;
            width: 100%;
            pointer-events: none;
            display: flex;
            justify-content: space-around;
            color: white;
            z-index: 10;
        }
        .stat-card {
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 20px;
            border-radius: 15px;
            border: 2px solid #ed8936;
            text-align: center;
        }
        #overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: white;
        }
        .btn {
            background: #ed8936;
            color: white;
            padding: 15px 40px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 1.5rem;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            pointer-events: auto;
            border: none;
            margin-top: 20px;
        }
        .btn:hover {
            transform: scale(1.1);
            background: #f6ad55;
        }
        .power-up-active {
            color: #f56565;
            text-shadow: 0 0 10px #f56565;
            animation: pulse 0.5s infinite alternate;
        }
        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.1); }
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="ui-layer">
        <div class="stat-card">
            <div class="text-xs uppercase">Süre</div>
            <div id="timer-display" class="text-2xl font-bold text-orange-400">60</div>
        </div>
        <div class="stat-card">
            <div class="text-xs uppercase">Skor</div>
            <div id="score-display" class="text-2xl font-bold">0</div>
        </div>
        <div id="streak-container" class="stat-card">
            <div class="text-xs uppercase">Kombo</div>
            <div id="streak-display" class="text-2xl font-bold text-yellow-400">0</div>
        </div>
    </div>

    <div id="overlay">
        <h1 class="text-5xl font-black mb-4 text-orange-500 text-center">BASKET SHOOTER PRO</h1>
        <p class="text-lg mb-6 text-center px-10">Topu sürükle ve fırlat!<br>Fizik kolaylaştırıldı: Az çekişle çok mesafe.</p>
        <button id="start-btn" class="btn">OYUNA BAŞLA</button>
    </div>

    <canvas id="gameCanvas"></canvas>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const startBtn = document.getElementById('start-btn');
    const overlay = document.getElementById('overlay');
    const timerDisplay = document.getElementById('timer-display');
    const scoreDisplay = document.getElementById('score-display');
    const streakDisplay = document.getElementById('streak-display');

    let score = 0;
    let timeLeft = 60;
    let gameActive = false;
    let streak = 0;
    let isPowerShot = false;
    let particles = [];
    let gameStartTimestamp = 0;
    let lastFrameTimestamp = 0;
    let animationFrameId = null;
    let netWave = 0;
    let netWaveVelocity = 0;

    const GAME_DURATION = 60;
    const FRAME_TIME_NORMALIZER = 16.67;

    let mouse = { x: 0, y: 0 };

    const gravity = 0.28;
    const friction = 0.992;
    const powerMultiplier = 0.24;
    const bounceDamping = 0.74;
    const floorBounce = 0.72;

    let ball = {
        x: 0, y: 0, radius: 25,
        vx: 0, vy: 0,
        isFlying: false,
        isGrabbed: false,
        startX: 0, startY: 0,
        prevX: 0, prevY: 0,
        scoredThisShot: false
    };

    const hoop = {
        x: 0, y: 0, width: 96, rimRadius: 9,
        boardOffsetX: 10,
        boardWidth: 10,
        boardHeight: 108,
        boardTopOffset: -88
    };

    function getRimLeft() { return hoop.x - hoop.width / 2; }
    function getRimRight() { return hoop.x + hoop.width / 2; }
    function getBoardX() { return getRimRight() + hoop.boardOffsetX; }
    function getBoardY() { return hoop.y + hoop.boardTopOffset; }

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        hoop.x = canvas.width - 190;
        hoop.y = canvas.height * 0.36;
        resetBall();
        draw(performance.now());
    }

    function resetBall() {
        ball.x = canvas.width * 0.32;
        ball.y = canvas.height - 130;
        ball.vx = 0;
        ball.vy = 0;
        ball.prevX = ball.x;
        ball.prevY = ball.y;
        ball.isFlying = false;
        ball.isGrabbed = false;
        ball.scoredThisShot = false;
    }

    function getMousePos(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = (e.touches && e.touches[0]) ? e.touches[0].clientX : e.clientX;
        const clientY = (e.touches && e.touches[0]) ? e.touches[0].clientY : e.clientY;
        return { x: clientX - rect.left, y: clientY - rect.top };
    }

    const handleStart = (e) => {
        if (!gameActive) return;
        const pos = getMousePos(e);
        const dist = Math.hypot(pos.x - ball.x, pos.y - ball.y);
        if (dist < ball.radius * 3) {
            ball.isGrabbed = true;
            mouse.x = pos.x;
            mouse.y = pos.y;
        }
    };

    const handleMove = (e) => {
        if (ball.isGrabbed) {
            const pos = getMousePos(e);
            mouse.x = pos.x;
            mouse.y = pos.y;
        }
    };

    const handleEnd = () => {
        if (ball.isGrabbed) {
            ball.isGrabbed = false;
            ball.startX = ball.x;
            ball.startY = ball.y;
            const dx = ball.x - mouse.x;
            const dy = ball.y - mouse.y;

            ball.vx = dx * powerMultiplier;
            ball.vy = dy * powerMultiplier;
            ball.isFlying = true;
            ball.scoredThisShot = false;
        }
    };

    canvas.addEventListener('mousedown', handleStart);
    canvas.addEventListener('mousemove', handleMove);
    window.addEventListener('mouseup', handleEnd);
    canvas.addEventListener('touchstart', handleStart, { passive: false });
    canvas.addEventListener('touchmove', handleMove, { passive: false });
    window.addEventListener('touchend', handleEnd);

    function createParticles(x, y, color, amount = 20) {
        for (let i = 0; i < amount; i++) {
            particles.push({
                x, y,
                vx: (Math.random() - 0.5) * 12,
                vy: (Math.random() - 0.5) * 12,
                life: 1,
                color
            });
        }
    }

    function induceNetWave(force) {
        netWaveVelocity += Math.max(-2.2, Math.min(2.2, force));
    }

    function collideWithPoint(px, py) {
        const dx = ball.x - px;
        const dy = ball.y - py;
        const dist = Math.hypot(dx, dy);
        const minDist = ball.radius + hoop.rimRadius;
        if (dist < minDist && dist > 0) {
            const nx = dx / dist;
            const ny = dy / dist;
            const overlap = minDist - dist;
            ball.x += nx * overlap;
            ball.y += ny * overlap;

            const normalVel = ball.vx * nx + ball.vy * ny;
            if (normalVel < 0) {
                ball.vx -= (1 + bounceDamping) * normalVel * nx;
                ball.vy -= (1 + bounceDamping) * normalVel * ny;
                ball.vx *= 0.98;
                ball.vy *= 0.98;
                induceNetWave(Math.abs(normalVel) * 0.06);
            }
        }
    }

    function handleHoopCollisions() {
        const rimLeft = getRimLeft();
        const rimRight = getRimRight();
        const rimY = hoop.y;

        collideWithPoint(rimLeft, rimY);
        collideWithPoint(rimRight, rimY);

        const boardX = getBoardX();
        const boardY = getBoardY();
        const boardBottom = boardY + hoop.boardHeight;

        if (ball.x + ball.radius > boardX &&
            ball.x - ball.radius < boardX + hoop.boardWidth &&
            ball.y + ball.radius > boardY &&
            ball.y - ball.radius < boardBottom) {

            if (ball.prevX + ball.radius <= boardX) {
                ball.x = boardX - ball.radius;
                ball.vx = -Math.abs(ball.vx) * 0.78;
                induceNetWave(Math.abs(ball.vx) * 0.03);
            } else if (ball.prevY <= boardY && ball.vy > 0) {
                ball.y = boardY - ball.radius;
                ball.vy *= -0.66;
                induceNetWave(Math.abs(ball.vy) * 0.025);
            } else {
                ball.x = boardX + hoop.boardWidth + ball.radius;
                ball.vx = Math.abs(ball.vx) * 0.6;
                induceNetWave(Math.abs(ball.vx) * 0.02);
            }
        }

        const innerLeft = rimLeft + hoop.rimRadius * 0.9;
        const innerRight = rimRight - hoop.rimRadius * 0.9;
        const prevToCurrentY = ball.y - ball.prevY;

        if (!ball.scoredThisShot && prevToCurrentY > 0) {
            const crossedRimPlane = ball.prevY <= rimY && ball.y >= rimY;
            const crossedCenterPlane = ball.prevY <= rimY + ball.radius * 0.2 && ball.y >= rimY + ball.radius * 0.2;
            if (crossedRimPlane || crossedCenterPlane) {
                const t = (rimY - ball.prevY) / (prevToCurrentY || 1);
                const lerpedX = ball.prevX + (ball.x - ball.prevX) * Math.max(0, Math.min(1, t));
                if (lerpedX > innerLeft && lerpedX < innerRight) {
                    ball.scoredThisShot = true;
                    induceNetWave(Math.min(3, Math.abs(ball.vy) * 0.2 + Math.abs(ball.vx) * 0.08 + 0.6));
                    scoreBasket();
                }
            }
        }
    }

    function update(deltaMultiplier = 1) {
        if (!gameActive) return;

        if (ball.isFlying) {
            ball.prevX = ball.x;
            ball.prevY = ball.y;

            ball.vy += gravity * deltaMultiplier;
            ball.vx *= Math.pow(friction, deltaMultiplier);
            ball.x += ball.vx * deltaMultiplier;
            ball.y += ball.vy * deltaMultiplier;

            if (ball.x + ball.radius > canvas.width) {
                ball.x = canvas.width - ball.radius;
                ball.vx *= -0.65;
            } else if (ball.x - ball.radius < 0) {
                ball.x = ball.radius;
                ball.vx *= -0.65;
            }

            const floorY = canvas.height - 22;
            if (ball.y + ball.radius > floorY) {
                ball.y = floorY - ball.radius;
                if (Math.abs(ball.vy) > 0.35) {
                    ball.vy *= -floorBounce;
                    ball.vx *= 0.93;
                } else {
                    ball.vy = 0;
                    ball.vx *= 0.9;
                }
                induceNetWave(Math.abs(ball.vx) * 0.01);
            }

            handleHoopCollisions();

            if (ball.y - ball.radius > canvas.height || ball.x > canvas.width + 120 || ball.x < -120) {
                streak = 0;
                isPowerShot = false;
                streakDisplay.innerText = streak;
                streakDisplay.classList.remove('power-up-active');
                resetBall();
            }

            if (ball.scoredThisShot && ball.y > hoop.y + 95) {
                resetBall();
            }
        }

        if (ball.isFlying && ball.x > getRimLeft() - 20 && ball.x < getRimRight() + 20 && ball.y > hoop.y - 10 && ball.y < hoop.y + 72) {
            induceNetWave(ball.vx * 0.004 * deltaMultiplier);
        }

        netWaveVelocity += (0 - netWave) * 0.03 * deltaMultiplier;
        netWaveVelocity *= Math.pow(0.87, deltaMultiplier);
        netWave += netWaveVelocity * deltaMultiplier;

        particles.forEach((p) => {
            p.x += p.vx * deltaMultiplier;
            p.y += p.vy * deltaMultiplier;
            p.vy += 0.08 * deltaMultiplier;
            p.life -= 0.02 * deltaMultiplier;
        });
        particles = particles.filter(p => p.life > 0);
    }

    function scoreBasket() {
        let points = 2;
        if (ball.startX < canvas.width * 0.4) points = 3;

        if (isPowerShot) {
            points = 10;
            createParticles(hoop.x, hoop.y + 10, '#ff4500', 34);
            isPowerShot = false;
            streak = 0;
        } else {
            streak++;
            createParticles(hoop.x, hoop.y + 10, '#fbbf24', 24);
        }

        if (streak >= 3) isPowerShot = true;

        score += points;
        scoreDisplay.innerText = score;
        streakDisplay.innerText = streak;

        if (isPowerShot) streakDisplay.classList.add('power-up-active');
        else streakDisplay.classList.remove('power-up-active');
    }

    function drawNet(timestamp) {
        const rimLeft = getRimLeft();
        const rimRight = getRimRight();
        const rimCenter = (rimLeft + rimRight) / 2;
        const rimY = hoop.y + 1;
        const netDepth = 64;
        const segments = 10;
        const neckWidth = hoop.width * 0.46;

        for (let i = 0; i <= segments; i++) {
            const t = i / segments;
            const xTop = rimLeft + t * (rimRight - rimLeft);
            const xBottom = rimCenter + (t - 0.5) * neckWidth;
            const sway = Math.sin(timestamp * 0.011 + i * 0.75) * netWave * (0.35 + (1 - Math.abs(t - 0.5) * 1.4));
            const controlTaper = (t - 0.5) * 22;

            ctx.strokeStyle = 'rgba(241,245,249,0.58)';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(xTop, rimY);
            ctx.quadraticCurveTo(
                xTop + controlTaper + sway,
                rimY + netDepth * 0.52,
                xBottom + sway * 0.7,
                rimY + netDepth
            );
            ctx.stroke();
        }

        for (let row = 1; row <= 6; row++) {
            const rowT = row / 6;
            const rowY = rimY + rowT * netDepth;
            const rowWidth = hoop.width - (hoop.width - neckWidth) * rowT;
            const left = rimCenter - rowWidth / 2;
            const right = rimCenter + rowWidth / 2;
            const sway = Math.sin(timestamp * 0.014 + row * 0.92) * netWave * (1 - rowT * 0.35);

            ctx.strokeStyle = `rgba(248,250,252,${0.56 - rowT * 0.24})`;
            ctx.lineWidth = 1.1;
            ctx.beginPath();
            ctx.moveTo(left + sway, rowY);
            ctx.quadraticCurveTo(rimCenter + sway * 1.2, rowY + 2, right + sway, rowY);
            ctx.stroke();
        }
    }

    function draw(timestamp = 0) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const nightSky = ctx.createLinearGradient(0, 0, 0, canvas.height);
        nightSky.addColorStop(0, '#111827');
        nightSky.addColorStop(0.65, '#0f172a');
        nightSky.addColorStop(1, '#020617');
        ctx.fillStyle = nightSky;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        for (let i = 0; i < 28; i++) {
            const x = (i * 127.3) % canvas.width;
            const y = ((i * 93.1) % (canvas.height * 0.5)) + 10;
            const flicker = 0.45 + Math.sin(timestamp * 0.003 + i) * 0.2;
            ctx.fillStyle = `rgba(255,255,255,${flicker.toFixed(2)})`;
            ctx.beginPath();
            ctx.arc(x, y, i % 3 === 0 ? 2 : 1.2, 0, Math.PI * 2);
            ctx.fill();
        }

        const courtTop = canvas.height * 0.62;
        const courtGrad = ctx.createLinearGradient(0, courtTop, 0, canvas.height);
        courtGrad.addColorStop(0, '#d9a066');
        courtGrad.addColorStop(1, '#a6683f');
        ctx.fillStyle = courtGrad;
        ctx.fillRect(0, courtTop, canvas.width, canvas.height - courtTop);

        const plankCount = 22;
        for (let i = 0; i < plankCount; i++) {
            const plankY = courtTop + ((canvas.height - courtTop) / plankCount) * i;
            const plankH = (canvas.height - courtTop) / plankCount;
            const tone = i % 2 === 0 ? 'rgba(255,220,170,0.08)' : 'rgba(90,50,20,0.1)';
            ctx.fillStyle = tone;
            ctx.fillRect(0, plankY, canvas.width, plankH);
        }

        ctx.strokeStyle = 'rgba(110,60,28,0.45)';
        ctx.lineWidth = 1;
        for (let i = 0; i < plankCount; i++) {
            const y = courtTop + ((canvas.height - courtTop) / plankCount) * i;
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(canvas.width, y);
            ctx.stroke();
        }

        ctx.strokeStyle = 'rgba(255,255,255,0.22)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(0, canvas.height, canvas.width * 0.35, 0, -Math.PI / 2, true);
        ctx.stroke();

        ctx.strokeStyle = 'rgba(255,255,255,0.28)';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(0, courtTop);
        ctx.lineTo(canvas.width, courtTop);
        ctx.stroke();

        const boardX = getBoardX();
        const boardY = getBoardY();

        ctx.fillStyle = 'rgba(241,245,249,0.85)';
        ctx.fillRect(boardX, boardY, hoop.boardWidth, hoop.boardHeight);

        const rimGrad = ctx.createLinearGradient(getRimLeft(), hoop.y, getRimRight(), hoop.y);
        rimGrad.addColorStop(0, '#f97316');
        rimGrad.addColorStop(1, '#ef4444');
        ctx.shadowBlur = 14;
        ctx.shadowColor = '#fb7185';
        ctx.strokeStyle = rimGrad;
        ctx.lineWidth = 6;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(getRimLeft(), hoop.y);
        ctx.lineTo(getRimRight(), hoop.y);
        ctx.stroke();

        ctx.shadowBlur = 0;

        drawNet(timestamp);

        particles.forEach(p => {
            ctx.globalAlpha = p.life;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
            ctx.fill();
        });
        ctx.globalAlpha = 1;

        ctx.save();
        ctx.translate(ball.x, ball.y);

        if (isPowerShot) {
            ctx.shadowBlur = 30;
            ctx.shadowColor = '#f56565';
            for (let i = 0; i < 3; i++) {
                ctx.fillStyle = '#f6ad55';
                ctx.beginPath();
                ctx.arc((Math.random() - 0.5) * 30, (Math.random() - 0.5) * 30, 12, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        const grad = ctx.createRadialGradient(-7, -7, 2, 0, 0, ball.radius);
        grad.addColorStop(0, '#fbd38d');
        grad.addColorStop(1, '#c05621');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(0, 0, ball.radius, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = 'rgba(120,53,15,0.8)';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(0, 0, ball.radius * 0.92, Math.PI * 0.2, Math.PI * 1.8);
        ctx.moveTo(-ball.radius * 0.85, -3);
        ctx.quadraticCurveTo(0, -ball.radius * 0.55, ball.radius * 0.85, -3);
        ctx.moveTo(-ball.radius * 0.7, ball.radius * 0.45);
        ctx.quadraticCurveTo(0, ball.radius * 0.15, ball.radius * 0.7, ball.radius * 0.45);
        ctx.stroke();

        ctx.strokeStyle = 'rgba(0,0,0,0.4)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, 0, ball.radius, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();

    }

    function gameLoop(timestamp) {
        if (!gameActive) return;

        const elapsedSec = (timestamp - gameStartTimestamp) / 1000;
        const newTimeLeft = Math.max(0, GAME_DURATION - Math.floor(elapsedSec));
        if (newTimeLeft !== timeLeft) {
            timeLeft = newTimeLeft;
            timerDisplay.innerText = timeLeft;
        }

        if (timeLeft <= 0) {
            endGame();
            return;
        }

        const frameDelta = lastFrameTimestamp ? (timestamp - lastFrameTimestamp) / FRAME_TIME_NORMALIZER : 1;
        const deltaMultiplier = Math.min(2.5, Math.max(0.6, frameDelta));
        lastFrameTimestamp = timestamp;

        update(deltaMultiplier);
        draw(timestamp);
        animationFrameId = requestAnimationFrame(gameLoop);
    }

    function startGame() {
        score = 0;
        timeLeft = GAME_DURATION;
        streak = 0;
        isPowerShot = false;
        gameActive = true;
        particles = [];
        netWave = 0;
        netWaveVelocity = 0;
        scoreDisplay.innerText = '0';
        streakDisplay.innerText = '0';
        timerDisplay.innerText = GAME_DURATION;
        streakDisplay.classList.remove('power-up-active');
        overlay.style.display = 'none';

        resetBall();
        gameStartTimestamp = performance.now();
        lastFrameTimestamp = gameStartTimestamp;
        if (animationFrameId) cancelAnimationFrame(animationFrameId);
        animationFrameId = requestAnimationFrame(gameLoop);
    }

    function endGame() {
        gameActive = false;
        if (animationFrameId) {
            cancelAnimationFrame(animationFrameId);
            animationFrameId = null;
        }
        overlay.style.display = 'flex';
        overlay.innerHTML = `
            <h1 class="text-5xl font-black mb-2 text-orange-500">SÜRE DOLDU!</h1>
            <div class="text-3xl mb-6">Toplam Skor: <span class="text-yellow-400 font-bold">${score}</span></div>
            <button onclick="location.reload()" class="btn">YENİDEN DENE</button>
        `;
    }

    startBtn.addEventListener('click', startGame);
    window.addEventListener('resize', resize);

    resize();
    draw(performance.now());
</script>
</body>
</html>
